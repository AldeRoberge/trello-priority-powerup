<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerveau</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"
  />
  <link rel="stylesheet" href="./components/shared/trello-theme.css" />
  <link rel="stylesheet" href="./components/priority/priority-ui.css" />
  <script src="./components/shared/brand.js"></script>
  <script src="./components/shared/rest-config.js"></script>
  <script src="./components/shared/debug-log.js"></script>
  <script src="./components/priority/priority-matrix.js"></script>
  <script src="./components/priority/priority-ui.js"></script>
  <script src="./components/priority/priority-trello.js"></script>
  <script src="./components/statut/statut-match.js"></script>
  <script src="./components/statut/statut-trello.js"></script>
  <script src="./components/completion/completion-trello.js"></script>
  <script src="./components/profile/user-profile.js"></script>
  <style>
    body.tp-card-open {
      margin: 0;
      padding: 2px 0 4px;
    }
    /* Match Trello card chrome — theme --tp-bg (#0d1117) is too black */
    html[data-color-mode="dark"] body.tp-card-open {
      background: #172b4d;
    }
    .tp-card-open-shell {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .tp-card-open-overview {
      min-width: 0;
    }
    .tp-card-open-overview .variant-overview-section--compact {
      width: 100%;
    }
    .tp-card-open-loading {
      margin: 0;
      padding: 8px 2px;
      font-size: 12px;
      color: var(--ds-text-subtle, #626f86);
    }
    .tp-card-open-busy .overview-action-chip {
      pointer-events: none;
      opacity: 0.65;
    }
  </style>
</head>
<body class="tp-page tp-card-open">
  <div class="tp-card-open-shell">
    <div class="tp-card-open-overview" id="overviewMount">
      <p class="tp-card-open-loading" id="overviewLoading">Chargement…</p>
    </div>
  </div>
  <script>
    (function () {
      var STORAGE_PREFIX = 'cerveau.autoModal.';
      var brand = window.PriorityBrand;
      var appName =
        brand && typeof brand.getAppName === 'function'
          ? brand.getAppName()
          : 'Trello Cerveau';

      if (brand && typeof brand.applyDocumentTitle === 'function') {
        brand.applyDocumentTitle(document);
      } else {
        document.title = appName;
      }

      var overviewMount = document.getElementById('overviewMount');
      var overviewLoading = document.getElementById('overviewLoading');
      var overviewUi = null;
      var overviewRefreshChain = Promise.resolve();
      var overviewLiveSyncStarted = false;
      var overviewLiveSyncTimer = null;
      var appliedOverviewFp = '';
      var actionBusy = false;
      // Safety-net only — t.render + visibilitychange already refresh on card changes.
      // A short interval re-ran getBadgeData/statut often and amplified API load.
      var LIVE_SYNC_POLL_MS = 30000;

      function stableFp(value) {
        try {
          return JSON.stringify(value == null ? null : value);
        } catch (e) {
          return '';
        }
      }

      function storageKey(cardId) {
        return STORAGE_PREFIX + String(cardId || '');
      }

      function resize(t) {
        if (typeof t.sizeTo === 'function') {
          try {
            t.sizeTo(document.body);
          } catch (e) {
            /* ignore */
          }
        }
      }

      function setBusy(on) {
        actionBusy = !!on;
        document.body.classList.toggle('tp-card-open-busy', actionBusy);
      }

      function loadAutoOpenPreference(t) {
        if (typeof UserProfile === 'undefined' || typeof UserProfile.load !== 'function') {
          return Promise.resolve(true);
        }
        return UserProfile.load(t)
          .then(function (profile) {
            if (typeof UserProfile.isAutoOpenCerveauEnabled === 'function') {
              return UserProfile.isAutoOpenCerveauEnabled(profile);
            }
            return !profile || profile.autoOpenCerveau !== false;
          })
          .catch(function () {
            return true;
          });
      }

      function applyOverviewSnap(snap, options) {
        options = options || {};
        var next = snap || {};
        var fp = stableFp(next);
        if (!options.force && fp && fp === appliedOverviewFp) {
          resize(options.t);
          return false;
        }
        appliedOverviewFp = fp;
        if (overviewUi && typeof overviewUi.setData === 'function') {
          overviewUi.setData(next);
        }
        resize(options.t);
        return true;
      }

      function refreshOverview(t, options) {
        options = options || {};
        if (
          !overviewUi ||
          !window.PriorityTrello ||
          typeof PriorityTrello.getCardOverviewSnapshot !== 'function'
        ) {
          return Promise.resolve(false);
        }
        overviewRefreshChain = overviewRefreshChain
          .then(function () {
            return PriorityTrello.getCardOverviewSnapshot(t);
          })
          .then(function (snap) {
            return applyOverviewSnap(snap, { t: t, force: !!options.force });
          })
          .catch(function (err) {
            if (window.TpDebug) TpDebug.error('cardOpen', 'overview.refresh', err);
            else console.error('Card-back overview refresh failed', err);
            return false;
          });
        return overviewRefreshChain;
      }

      function startOverviewLiveSync(t) {
        if (overviewLiveSyncStarted) return;
        overviewLiveSyncStarted = true;
        if (window.TpDebug) TpDebug.log('cardOpen', 'overview.liveSync.start');
        if (overviewLiveSyncTimer) clearInterval(overviewLiveSyncTimer);
        overviewLiveSyncTimer = setInterval(function () {
          if (document.visibilityState === 'hidden') return;
          refreshOverview(t);
        }, LIVE_SYNC_POLL_MS);
        if (typeof t.render === 'function') {
          t.render(function () {
            refreshOverview(t);
          });
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            refreshOverview(t);
          }
        });
      }

      function tomorrowDueIso() {
        if (
          window.PriorityUI &&
          typeof PriorityUI.resolveDueDateQuickSuggestion === 'function'
        ) {
          var resolved = PriorityUI.resolveDueDateQuickSuggestion('demain-matin');
          if (resolved && resolved.iso) return resolved.iso;
        }
        var now = new Date();
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        return (
          d.getFullYear() +
          '-' +
          String(d.getMonth() + 1).padStart(2, '0') +
          '-' +
          String(d.getDate()).padStart(2, '0')
        );
      }

      function withProgressEnabled(data) {
        var next = Object.assign({}, data || { items: [] });
        if (next.progressEnabled === false) delete next.progressEnabled;
        return next;
      }

      function overviewCompleteCard(t) {
        var CT = window.CompletionTrello;
        if (!CT || typeof CT.getCardCompletion !== 'function') {
          return Promise.reject(new Error('CompletionTrello unavailable'));
        }
        return CT.getCardCompletion(t).then(function (data) {
          var next = withProgressEnabled(CT.markFullyComplete(data));
          return CT.saveCardCompletion(t, next).then(function (saved) {
            var chain = Promise.resolve(saved);
            if (typeof CT.syncCardDueCompleteFromProgress === 'function') {
              chain = chain.then(function () {
                return CT.syncCardDueCompleteFromProgress(t, saved, {});
              });
            }
            if (
              window.StatutTrello &&
              typeof StatutTrello.maybeAutoMoveForCompleted === 'function'
            ) {
              chain = chain.then(function () {
                return StatutTrello.maybeAutoMoveForCompleted(t);
              });
            }
            return chain;
          });
        });
      }

      function overviewUnblockCard(t) {
        var CT = window.CompletionTrello;
        var PT = window.PriorityTrello;
        var completionStep = Promise.resolve();
        if (CT && typeof CT.getCardCompletion === 'function') {
          completionStep = CT.getCardCompletion(t).then(function (data) {
            var next =
              typeof CT.clearAllBlocked === 'function'
                ? CT.clearAllBlocked(data)
                : CT.setMasterBlocked(data, false);
            return CT.saveCardCompletion(t, next);
          });
        }
        return completionStep.then(function () {
          if (!PT || typeof PT.getCardInputs !== 'function') return null;
          return PT.getCardInputs(t).then(function (inputs) {
            return PT.saveCardInputs(
              t,
              Object.assign({}, inputs || {}, {
                enAttente: false,
                blockedReasons: [],
                blockedLinks: []
              })
            );
          });
        });
      }

      function overviewBlockWithReasons(t, reasons) {
        var list =
          window.PriorityUI && typeof PriorityUI.normalizeBlockedReasons === 'function'
            ? PriorityUI.normalizeBlockedReasons(reasons)
            : Array.isArray(reasons)
              ? reasons.filter(Boolean)
              : [];
        if (!list.length) return Promise.resolve(false);

        var CT = window.CompletionTrello;
        var PT = window.PriorityTrello;
        var completionStep = Promise.resolve();
        if (CT && typeof CT.getCardCompletion === 'function') {
          completionStep = CT.getCardCompletion(t).then(function (data) {
            var next = withProgressEnabled(
              CT.setMasterBlockedReasons(data, list, { origin: 'user' })
            );
            return CT.saveCardCompletion(t, next);
          });
        }
        return completionStep.then(function () {
          if (!PT || typeof PT.getCardInputs !== 'function') return null;
          return PT.getCardInputs(t).then(function (inputs) {
            return PT.saveCardInputs(
              t,
              Object.assign({}, inputs || {}, {
                enAttente: true,
                blockedReasons: list
              })
            );
          });
        });
      }

      function overviewPostponeDueTomorrow(t) {
        var PT = window.PriorityTrello;
        if (!PT || typeof PT.getCardInputs !== 'function') {
          return Promise.reject(new Error('PriorityTrello unavailable'));
        }
        var iso = tomorrowDueIso();
        return PT.getCardInputs(t).then(function (inputs) {
          return PT.saveCardInputs(
            t,
            Object.assign({}, inputs || {}, {
              dueDate: iso,
              dueEnabled: true,
              dueTime: (inputs && inputs.dueTime) || ''
            })
          );
        });
      }

      function overviewAddSubtask(t, text) {
        var label = typeof text === 'string' ? text.trim() : '';
        if (!label) return Promise.resolve(false);
        var CT = window.CompletionTrello;
        if (!CT || typeof CT.getCardCompletion !== 'function') {
          return Promise.reject(new Error('CompletionTrello unavailable'));
        }
        return CT.getCardCompletion(t).then(function (data) {
          var item = CT.normalizeItem({
            id: CT.generateId(),
            text: label,
            progress: 0
          });
          if (!item) return false;
          var next = withProgressEnabled(
            Object.assign({}, data || { items: [] }, {
              items: ((data && data.items) || []).concat([item])
            })
          );
          return CT.saveCardCompletion(t, next);
        });
      }

      function overviewToggleTask(t, itemId) {
        var id = itemId != null ? String(itemId) : '';
        if (!id) return Promise.resolve(false);
        var CT = window.CompletionTrello;
        if (!CT || typeof CT.getCardCompletion !== 'function') {
          return Promise.reject(new Error('CompletionTrello unavailable'));
        }
        return CT.getCardCompletion(t).then(function (data) {
          var items = (data && data.items) || [];
          var target = null;
          for (var i = 0; i < items.length; i++) {
            if (items[i] && String(items[i].id) === id) {
              target = items[i];
              break;
            }
          }
          if (!target) return false;
          var done =
            !!target.done ||
            (target.progress != null && Number(target.progress) >= 100);
          var next = CT.applyItemProgress(data, id, done ? 0 : 100);
          return CT.saveCardCompletion(t, next).then(function (saved) {
            if (typeof CT.syncCardDueCompleteFromProgress === 'function') {
              return CT.syncCardDueCompleteFromProgress(t, saved, {}).then(
                function () {
                  return saved;
                }
              );
            }
            return saved;
          });
        });
      }

      function handleOverviewAction(t, actionId, payload) {
        if (actionBusy) return Promise.resolve(false);
        var run = Promise.resolve(false);
        if (actionId === 'complete') {
          run = overviewCompleteCard(t);
        } else if (actionId === 'unblock') {
          run = overviewUnblockCard(t);
        } else if (actionId === 'postpone-tomorrow') {
          run = overviewPostponeDueTomorrow(t);
        } else if (actionId === 'block') {
          run = overviewBlockWithReasons(t, payload && payload.reasons);
        } else if (actionId === 'add-subtask') {
          run = overviewAddSubtask(t, payload && payload.text);
        } else if (actionId === 'toggle-task') {
          run = overviewToggleTask(t, payload && payload.id);
        } else {
          return Promise.resolve(false);
        }

        setBusy(true);
        return run
          .then(function () {
            return refreshOverview(t, { force: true });
          })
          .catch(function (err) {
            if (window.TpDebug) TpDebug.error('cardOpen', 'overview.action', err);
            else console.error('Card-back overview action failed', err);
            return false;
          })
          .then(function (result) {
            setBusy(false);
            resize(t);
            return result;
          });
      }

      function openCerveauModal(t, options) {
        options = options || {};
        return Promise.resolve()
          .then(function () {
            return t.card('id', 'name');
          })
          .then(function (card) {
            var cardId = card && card.id ? card.id : '';
            var cardName = card && typeof card.name === 'string' ? card.name : '';
            var key = storageKey(cardId);
            if (!options.force && cardId) {
              try {
                if (sessionStorage.getItem(key) === '1') {
                  if (window.TpDebug) {
                    TpDebug.log('cardOpen', 'modal.skip', { reason: 'already-open' });
                  }
                  return null;
                }
                sessionStorage.setItem(key, '1');
              } catch (e) {
                /* private mode / blocked storage — still open */
              }
            } else if (options.force && cardId) {
              try {
                sessionStorage.setItem(key, '1');
              } catch (e) {
                /* ignore */
              }
            }
            if (window.TpDebug) {
              TpDebug.log('cardOpen', 'modal.open', { force: !!options.force });
            }
            return t.modal({
              title: appName,
              url: PriorityTrello.pageUrl('./popup.html'),
              args: {
                cardName: cardName,
                openSection: options.openSection || 'overview'
              },
              height: 1100,
              fullscreen: true,
              accentColor: '#22272B',
              callback: function () {
                try {
                  if (cardId) sessionStorage.removeItem(key);
                } catch (e) {
                  /* ignore */
                }
                if (window.TpDebug) TpDebug.log('cardOpen', 'modal.closed');
                // Modal edits land in shared plugin data; refresh the strip
                // immediately so users do not need to close/reopen the card.
                refreshOverview(t, { force: true });
              },
            });
          });
      }

      function mountOverview(t) {
        if (
          !overviewMount ||
          !window.PriorityUI ||
          typeof PriorityUI.createOverviewField !== 'function' ||
          !window.PriorityTrello ||
          typeof PriorityTrello.getCardOverviewSnapshot !== 'function'
        ) {
          if (overviewLoading) {
            overviewLoading.textContent = '';
            overviewLoading.hidden = true;
          }
          return Promise.resolve();
        }

        if (overviewLoading) {
          overviewLoading.textContent = 'Chargement de l\u2019aper\u00e7u\u2026';
          overviewLoading.hidden = false;
        }

        overviewUi = PriorityUI.createOverviewField({
          el: overviewMount,
          compact: true,
          onJump: function (section) {
            openCerveauModal(t, {
              force: true,
              openSection: section || 'overview'
            }).catch(function (err) {
              if (window.TpDebug) TpDebug.error('cardOpen', 'modal.jump', err);
              else console.error('Cerveau modal open failed', err);
            });
          },
          onAction: function (actionId, payload) {
            handleOverviewAction(t, actionId, payload);
          },
          onLayoutChange: function () {
            resize(t);
          }
        });
        if (overviewLoading) {
          overviewLoading.textContent =
            'R\u00e9cup\u00e9ration priorit\u00e9, progr\u00e8s et statut\u2026';
        }

        return PriorityTrello.getCardOverviewSnapshot(t)
          .then(function (snap) {
            if (overviewLoading && overviewLoading.parentNode) {
              overviewLoading.parentNode.removeChild(overviewLoading);
            }
            applyOverviewSnap(snap, { t: t, force: true });
            startOverviewLiveSync(t);
          })
          .catch(function (err) {
            if (overviewLoading) {
              overviewLoading.textContent = 'Aper\u00e7u indisponible';
            }
            if (window.TpDebug) TpDebug.error('cardOpen', 'overview.load', err);
            else console.error('Card-back overview load failed', err);
            resize(t);
            // Still listen so a later successful fetch can paint the strip.
            startOverviewLiveSync(t);
          });
      }

      PriorityTrello.initIframePage(function (t) {
        if (window.TpDebug && typeof TpDebug.configureFromProfile === 'function') {
          TpDebug.configureFromProfile(t).then(function (on) {
            if (on) TpDebug.log('cardOpen', 'page.init');
          });
        }

        resize(t);

        var overviewReady = mountOverview(t);

        return loadAutoOpenPreference(t).then(function (autoEnabled) {
          resize(t);
          return overviewReady.then(function () {
            if (!autoEnabled) {
              if (window.TpDebug) {
                TpDebug.log('cardOpen', 'modal.skip', { reason: 'pref-disabled' });
              }
              return null;
            }
            return openCerveauModal(t).then(
              function () {
                resize(t);
              },
              function (err) {
                if (window.TpDebug) TpDebug.error('cardOpen', 'modal.auto', err);
                else console.error('Cerveau auto-open failed', err);
                resize(t);
              }
            );
          });
        });
      });
    })();
  </script>
</body>
</html>
