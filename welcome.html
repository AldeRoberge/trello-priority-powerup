<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenue</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./components/shared/brand.js"></script>
  <script src="./components/shared/debug-log.js"></script>
  <script src="./components/priority/priority-trello.js"></script>
  <link rel="stylesheet" href="./components/shared/trello-theme.css" />
  <link rel="icon" type="image/png" href="./assets/icon.png" />
  <link rel="stylesheet" href="./components/shared/context-menu.css?v=ctx-menu-6" />
  <script src="./components/shared/context-menu.js?v=ctx-menu-6"></script>
</head>
<body class="tp-page tp-page--roomy tp-page--welcome">
  <div class="tp-welcome-brand">
    <img id="brandLogo" class="tp-welcome-logo" src="./assets/icon.png" alt="" width="48" height="48" />
    <h1 class="tp-title" id="brandTitle">Trello Cerveau</h1>
  </div>

  <button class="tp-btn tp-btn--primary" type="button" id="startBtn" style="width:100%">Commencer</button>

  <script>
    (function () {
      var brand = window.PriorityBrand;
      var name =
        brand && typeof brand.getAppName === 'function' ? brand.getAppName() : 'Trello Cerveau';
      if (brand && typeof brand.applyDocumentTitle === 'function') {
        brand.applyDocumentTitle(document);
      } else {
        document.title = name;
      }
      var titleEl = document.getElementById('brandTitle');
      if (titleEl) titleEl.textContent = name;
      var logoEl = document.getElementById('brandLogo');
      if (logoEl) {
        logoEl.alt = name;
        if (brand && brand.iconPng) logoEl.src = brand.iconPng;
      }
    })();

    PriorityTrello.initIframePage(function (t) {
    if (window.TpDebug && typeof TpDebug.configureFromProfile === 'function') {
      TpDebug.configureFromProfile(t).then(function (on) {
        if (on) TpDebug.log('welcome', 'page.init');
      });
    }
    document.getElementById('startBtn').addEventListener('click', function () {
      if (window.TpDebug) TpDebug.log('welcome', 'dismiss');
      t.closeModal();
    });
    if (typeof t.sizeTo === 'function') {
      return t.sizeTo(document.body);
    }
    }).catch(function (err) {
      if (window.TpDebug) TpDebug.error('welcome', 'init', err);
      else console.error('Priority welcome init failed', err);
    });
  </script>
</body>
</html>
