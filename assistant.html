  <script>
    (function () {
      try {
        var m = localStorage.getItem('trello-priority-powerup/color-mode');
        if (m !== 'dark' && m !== 'light') return;
        var root = document.documentElement;
        root.setAttribute('data-color-mode', m);
        root.style.colorScheme = m;
        if (m === 'dark') root.style.backgroundColor = '#1d2125';
      } catch (e) {}
    })();
  </script>

<body class="tp-page tp-page--priority tp-page--assistant">
  <div id="viewTabs"></div>
  <div id="assistantMount"></div>
  <script>
    ViewTabs.mount(document.getElementById('viewTabs'), { active: 'assistant' });
    PriorityTrello.initIframePage(function (t) {
      if (window.TpDebug && typeof TpDebug.configureFromProfile === 'function') {
        TpDebug.configureFromProfile(t).then(function (on) {
          if (on) TpDebug.log('assistant', 'page.init');
        });
      }
      return AssistantMount.mount(document.getElementById('assistantMount'), t, { resizeBody: false });
    }).catch(function (err) {
      console.error('assistant init failed', err);
    });
  </script>
