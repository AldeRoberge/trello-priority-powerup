<body class="tp-page tp-page--keep">
  <div id="viewTabs"></div>
  <div id="app">
    <script>document.currentScript.parentNode.innerHTML = Skeleton.html('keep');</script>
  </div>
  <script>
    ViewTabs.mount(document.getElementById('viewTabs'), { active: 'keep' });
    PriorityTrello.initIframePage(function (t) {
      var store = KeepStore.create();
      var sync = KeepSync.create({ store: store, api: KeepSync.trelloApi(t) });
      KeepUI.mount(document.getElementById('app'), { sync: sync, store: store });
    });
  </script>
