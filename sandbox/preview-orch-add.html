<!DOCTYPE html>
<html lang="fr" data-color-mode="dark" style="color-scheme:dark;background:#1d2125">
<head>
  <meta charset="utf-8" />
  <title>Orchestrateur — aperçu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../components/shared/trello-theme.css" />
  <link rel="stylesheet" href="../components/dashboard/dashboard-ui.css?v=orch-add-2" />
  <script src="../components/dashboard/dashboard-model.js"></script>
  <script src="../components/shared/quick-parse.js"></script>
  <script src="../components/shared/work-os.js"></script>
  <script src="../components/dashboard/dashboard-ui.js?v=orch-add-2"></script>
</head>
<body class="tp-page tp-page--dashboard">
  <div id="root" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
  <script>
    var lists = [
      { id: 'l1', name: 'À faire', category: 'unstarted' },
      { id: 'l2', name: 'Inbox', category: 'triage' }
    ];
    var rows = [
      { id: 'a', name: 'Remboursement optométriste', statutKey: 'unstarted', listId: 'l1', due: '', start: '', estimate: 5, priority: 53, dueDone: false, pos: 1, items: [] }
    ];
    window.TableModel = {
      formatDay: function (iso) {
        var d = new Date(iso + 'T00:00:00');
        return d.getDate() + ' oct.';
      }
    };
    window.DashboardTrello = {
      getCapacity: function () { return 360; },
      setCapacity: function () {},
      getScale: function () { return 'day'; },
      setScale: function () {},
      listFor: function (ls, cats) {
        for (var i = 0; i < cats.length; i++) {
          for (var j = 0; j < ls.length; j++) if (ls[j].category === cats[i]) return ls[j];
        }
        return null;
      },
      load: function () { return Promise.resolve({ lists: lists, rows: rows.map(function (r) { return Object.assign({}, r); }) }); },
      planAt: function (t, id, iso, vague) {
        rows.forEach(function (r) {
          if (r.id !== id) return;
          r.dueVague = vague || '';
          r.dueMode = vague ? 'vague' : (iso ? 'precise' : '');
          r.start = vague ? '' : iso;
          r.due = vague ? '' : iso;
        });
        return Promise.resolve();
      },
      planDay: function (t, id, iso) { return this.planAt(t, id, iso, ''); }
    };
    window.TableTrello = {
      createRow: function (t, name, listId) {
        var id = 'card-' + Date.now();
        rows.push({ id: id, name: name, statutKey: 'unstarted', listId: listId, due: '', start: '', estimate: 0, priority: null, dueDone: false, pos: Date.now(), items: [] });
        return Promise.resolve({ cardId: id });
      }
    };
    DashboardUI.mount(document.getElementById('root'), {});
  </script>
</body>
</html>
