<!DOCTYPE html>
<html lang="fr" data-color-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Parcours</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/components/shared/trello-theme.css" />
  <link rel="stylesheet" href="/components/shared/context-menu.css" />
  <link rel="stylesheet" href="/components/shared/view-tabs.css" />
  <link rel="stylesheet" href="/components/shared/graph-canvas.css" />
  <link rel="stylesheet" href="/components/journey/journey-ui.css" />
  <link rel="stylesheet" href="/components/shared/view-shell.css?v=narrow-2" />
  <link rel="stylesheet" href="/components/shared/skeleton.css" />
  <script src="/components/shared/skeleton.js"></script>
</head>
<body class="tp-page tp-page--journey">
  <div id="viewTabs"></div>
  <div id="journeyMount"></div>
  <script src="/components/shared/hide-done.js"></script>
  <script src="/components/shared/context-menu.js"></script>
  <script src="/components/shared/view-tabs.js"></script>
  <script src="/components/shared/view-shell.js?v=narrow-2"></script>
  <script src="/components/shared/graph-canvas.js"></script>
  <script src="/components/shared/card-quick.js"></script>
  <script src="/components/shared/add-row.js"></script>
  <link rel="stylesheet" href="/components/shared/add-row.css" />
  <script src="/components/completion/completion-trello.js"></script>
  <script src="/components/journey/journey-model.js"></script>
  <script src="/components/journey/journey-ui.js"></script>
  <script>
    var cards = [
      { id: 'pick', name: "Choisir l'entrepreneur", category: 'started', blocked: false, progress: 0, dueDate: '2026-10-12', estimatedMinutes: 30, priorityScore: 6, inputs: { dependsOn: [], depTypes: {} }, items: [{ id: 'pick-1', text: 'Demander trois soumissions', done: false, progress: 0 }, { id: 'pick-2', text: 'Comparer les prix', done: false, progress: 0, dueDate: '2026-10-15', estimatedMinutes: 30 }, { id: 'pick-3', text: 'Appeler les références', done: true, progress: 100 }, { id: 'pick-4', text: 'Prévoir la visite', done: false, progress: 0, linkedCardId: 'visit' }], assignees: [{ name: 'Ada' }] },
      { id: 'visit', name: 'Visiter le chantier', category: 'started', blocked: false, progress: 40, priorityScore: 3, inputs: { dependsOn: [], depTypes: {} }, items: [] },
      { id: 'order', name: 'Commander les armoires', category: 'started', blocked: false, progress: 0, dueDate: '2026-10-14', priorityScore: 5, inputs: { dependsOn: ['pick'], depTypes: { pick: 'needs' } }, items: [] },
      { id: 'paint', name: 'Peindre', category: 'started', blocked: false, progress: 0, estimatedMinutes: 10, priorityScore: 2, inputs: { dependsOn: ['order'], depTypes: { order: 'after' } }, items: [] },
      { id: 'call', name: "Appeler l'assureur", category: 'started', blocked: true, progress: 0, priorityScore: 8, inputs: { dependsOn: [], depTypes: {} }, items: [] },
      { id: 'measure', name: 'Mesurer', category: 'started', blocked: false, progress: 0, priorityScore: 9, estimatedMinutes: 15, inputs: { dependsOn: [], depTypes: {} }, items: [] },
      { id: 'done', name: 'Déjà fait', category: 'completed', blocked: false, progress: 100, inputs: { dependsOn: [], depTypes: {} }, items: [] },
      { id: 'loose', name: 'Note libre', category: 'started', blocked: false, progress: 0, priorityScore: 1, inputs: { dependsOn: [], depTypes: {} }, items: [] }
    ];
    var goals = {
      nodes: [
        { id: 'g:mis', level: 'mission', name: 'Maison' },
        { id: 'g:cui', level: 'project', name: 'Cuisine' },
        { id: 'g:toit', level: 'project', name: 'Toit' }
      ],
      links: [
        { from: 'g:cui', to: 'g:mis' },
        { from: 'g:toit', to: 'g:mis' },
        { from: 't:pick', to: 'g:cui' },
        { from: 'order', to: 'g:cui' },
        { from: 'paint', to: 'g:cui' },
        { from: 'call', to: 'g:toit' },
        { from: 'measure', to: 'g:toit' },
        { from: 'measure', to: 'g:cui' }
      ]
    };
    var lists = [
      { id: 'l1', name: 'À faire' },
      { id: 'l2', name: 'Terminé' }
    ];
    var settings = { listCategories: { l1: 'started', l2: 'completed' } };

    // The real CompletionTrello, on an in-memory store: the subtask actions use its helpers.
    var store = {};
    cards.forEach(function (c) { if (c.items && c.items.length) store[c.id] = { items: c.items.map(function (i) { return Object.assign({}, i); }) }; });
    var realSave = CompletionTrello.saveCardCompletionById;
    CompletionTrello.saveCardCompletionById = function (_t, id, data) {
      return realSave(_t, id, data).then(function (out) {
        var rec = cards.filter(function (c) { return c.id === id; })[0];
        if (rec) {
          rec.items = out.items;
          rec.progress = CompletionTrello.computeCardProgress(out).percent;
        }
        return out;
      });
    };
    TableTrello = {
      saveName: function (_t, id, name) {
        var rec = cards.filter(function (c) { return c.id === id; })[0];
        if (rec) rec.name = name;
        return Promise.resolve();
      },
      moveCard: function (_t, id, listId) {
        var rec = cards.filter(function (c) { return c.id === id; })[0];
        if (rec) { rec.listId = listId; rec.category = listId === 'l2' ? 'completed' : 'started'; }
        return Promise.resolve();
      }
    };
    PriorityTrello = {
      pageUrl: function (u) { return u; },
      restPutCard: function (_t, id, body) {
        var rec = cards.filter(function (c) { return c.id === id; })[0];
        if (rec && body) {
          if (body.dueComplete != null) rec.dueComplete = !!body.dueComplete;
          if (body.idList) rec.listId = body.idList;
          if (body.idList === 'l2') rec.category = 'completed';
          if (body.idList === 'l1') rec.category = 'started';
        }
        return Promise.resolve({ ok: true });
      }
    };
    GanttTrello = {
      ensureRestAuthorized: function () { return Promise.resolve({ ok: true }); },
      removeTopLevelItem: function (data, itemId) {
        return CompletionTrello.normalizeCompletionData(Object.assign({}, data, { items: data.items.filter(function (i) { return i.id !== itemId; }) }));
      },
      setCardBlocked: function (_t, id, blocked) {
        var rec = cards.filter(function (c) { return c.id === id; })[0];
        if (rec) rec.blocked = !!blocked;
        return Promise.resolve({ ok: true });
      }
    };
    MindmapGoalsTrello = {
      save: function (_t, next) { goals = next; return Promise.resolve(); }
    };
    var t = {
      get: function (id, _scope, key) { return Promise.resolve(key === 'cardCompletion' ? store[id] : undefined); },
      set: function (id, _scope, key, val) { if (key === 'cardCompletion') store[id] = val; return Promise.resolve(); },
      modal: function (opts) {
        var note = document.getElementById('opened');
        if (note) note.textContent = 'Ouvert · ' + ((opts && opts.args && opts.args.cardName) || (opts && opts.title) || '');
        return Promise.resolve();
      }
    };
    ViewTabs.mount(document.getElementById('viewTabs'), { active: 'journey' });
    JourneyUI.mount(document.getElementById('journeyMount'), t, {
      load: function () {
        return Promise.resolve({ lists: lists, cards: cards, settings: settings, goals: goals });
      }
    });
  </script>
</body>
</html>
