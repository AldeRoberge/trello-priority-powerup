<!DOCTYPE html>
<html lang="fr" data-color-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entities visual harness (mock Trello)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/components/shared/trello-theme.css" />
  <link rel="stylesheet" href="/components/shared/view-tabs.css" />
  <link rel="stylesheet" href="/components/entities/entities-ui.css" />
</head>
<body class="tp-page tp-page--entities">
  <div id="viewTabs"></div>
  <div id="entitiesMount"></div>
  <script src="/components/shared/brand.js"></script>
  <script src="/components/shared/rest-config.js"></script>
  <script src="/components/shared/debug-log.js"></script>
  <script src="/components/shared/desc-meta.js"></script>
  <script src="/components/priority/priority-matrix.js"></script>
  <script src="/components/priority/priority-ui.js"></script>
  <script src="/components/priority/priority-trello.js"></script>
  <script src="/components/statut/statut-match.js"></script>
  <script src="/components/statut/statut-trello.js"></script>
  <script src="/components/completion/completion-trello.js"></script>
  <script src="/components/completion/completion-ui.js"></script>
  <script src="/components/gantt/gantt-model.js"></script>
  <script src="/components/gantt/gantt-trello.js"></script>
  <script src="/components/table/table-model.js"></script>
  <script src="/components/sheets/sheets-trello.js"></script>
  <script src="/components/shared/view-tabs.js"></script>
  <script src="/components/entities/entities-model.js"></script>
  <script src="/components/entities/entities-trello.js"></script>
  <script src="/components/entities/entities-ui.js"></script>
  <script src="/sandbox/e2e/fake-trello.js"></script>
  <script>
    // An in-memory Trello behind the real EntitiesTrello / EntitiesUI (no network).
    // ?dark switches the theme, ?unauth starts without a Trello token.
    var q = location.search;
    if (/[?&]dark\b/.test(q)) document.documentElement.setAttribute('data-color-mode', 'dark');
    window.fake = FakeTrello.create({
      authorized: !/[?&]unauth\b/.test(q),
      lists: [{ id: 'l1', name: 'À faire' }],
      cards: [{ id: 'c1', name: 'Une tâche', idList: 'l1' }],
    });
    SheetsTrello.trelloRest = fake.trelloRest;
    PriorityTrello.isRestAuthorized = function () { return Promise.resolve(!/[?&]unauth\b/.test(q)); };
    GanttTrello.ensureRestAuthorized = function () { fake.setAuthorized(true); PriorityTrello.isRestAuthorized = function () { return Promise.resolve(true); }; return Promise.resolve({ ok: true }); };
    PriorityTrello.pageUrl = function (p) { return p; };
    ViewTabs.mount(document.getElementById('viewTabs'), { active: 'entities' });
    window.ui = EntitiesUI.mount(document.getElementById('entitiesMount'), fake.t);
  </script>
</body>
</html>
