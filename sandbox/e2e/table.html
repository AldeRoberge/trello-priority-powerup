    // ---- mock Trello data (no network) ----
    var recs = [
      { id: 'c1', name: 'Préparer la réunion de lancement', listId: 'l1', listName: 'À faire', category: 'unstarted', color: '#626f86', pos: 1, progress: 0, priorityScore: 7.4, priorityLabel: 'Haute', inputs: { empressement: 'vite', impact: 8 }, dueDate: '2026-09-01', desc: 'Inviter **tout le monde**\n- ordre du jour\n- salle', url: 'https://trello.com/c/1' },

    TableTrello.load = function () {
      return new Promise(function (r) {
        setTimeout(function () {
          r({ lists: lists, rows: recs.map(function (x) { return TableModel.rowFromRecord(x, 'Projet'); }), categoryFieldId: null, categoryAvailable: false });
        }, window.__delay == null ? 1500 : window.__delay);
      });
    };
    TableTrello.getTableSettings = function () { return Promise.resolve({ columns: TableModel.DEFAULT_COLUMNS.slice() }); };
    SheetsTrello.getSettings = function () { return Promise.resolve({}); };
    PriorityTrello.isRestAuthorized = function () { return Promise.resolve(true); };
    var store = {};
    var t = {
      get: function (a, b, k) { return Promise.resolve(store[k] || null); },
      set: function (a, b, k, v) { store[k] = v; return Promise.resolve(); },
      board: function () { return Promise.resolve({ id: 'b1' }); },
      render: function (fn) { fn(); },
      sizeTo: function () {},
    };
    ViewTabs.mount(document.getElementById('viewTabs'), { active: 'table' });
    TableUI.mount(document.getElementById('tableMount'), t);
  </script>
