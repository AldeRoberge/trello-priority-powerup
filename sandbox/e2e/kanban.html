    // ---- mock Trello data (no network) ----
    var recs = [
      { id: 'c1', name: 'Préparer la réunion de lancement', listId: 'l1', listName: 'À faire', category: 'unstarted', color: '#626f86', pos: 1, progress: 0, priorityScore: 7.4, priorityTierI: 2, priorityLabel: 'Haute', inputs: { empressement: 'vite', impact: 8 }, dueDate: '2026-09-01', desc: 'Inviter **tout le monde**\n- ordre du jour\n- salle', url: 'https://trello.com/c/1', items: [{ text: 'Ordre du jour', done: true }, { text: 'Réserver la salle', done: false, items: [{ text: 'Confirmer l’heure', done: false }] }] },
      { id: 'c2', name: 'Refonte du tableau de bord', listId: 'l2', listName: 'En cours', category: 'started', color: '#1d7afc', pos: 2, progress: 45, priorityScore: 5.1, priorityTierI: 3, priorityLabel: 'Moyenne', inputs: { empressement: 'assez-vite', impact: 6 }, dueDate: '2026-11-20', desc: 'Nouvelle maquette', url: 'https://trello.com/c/2' },
      { id: 'c3', name: 'Publier la version 2', listId: 'l2', listName: 'En cours', category: 'started', color: '#1d7afc', pos: 3, progress: 100, priorityScore: 9.2, priorityTierI: 0, priorityLabel: 'Critique', inputs: { empressement: 'au-plus-vite', impact: 9 }, dueDate: '2026-10-05', desc: '', url: 'https://trello.com/c/3' },
      { id: 'c4', name: 'Archiver les anciennes cartes', listId: 'l1', listName: 'À faire', category: 'unstarted', color: '#626f86', pos: 4, progress: 10, blocked: true, priorityScore: 2.0, priorityTierI: 6, priorityLabel: 'Basse', inputs: { empressement: 'aucun', impact: 2 }, dueDate: '', desc: 'Rien de spécial', url: 'https://trello.com/c/4' },
      { id: 'c5', name: 'Écrire les notes de version', listId: 'l1', listName: 'À faire', category: 'unstarted', color: '#626f86', pos: 5, progress: 0, priorityScore: 5.0, priorityTierI: 3, priorityLabel: 'Importante', inputs: { empressement: 'bientot', impact: 5 }, dueDate: '', desc: '', url: 'https://trello.com/c/5' },
      { id: 'c6', name: 'Réviser les droits d’accès', listId: 'l2', listName: 'En cours', category: 'started', color: '#1d7afc', pos: 6, progress: 20, priorityScore: 4.6, priorityTierI: 3, priorityLabel: 'Importante', inputs: { empressement: 'bientot', impact: 5 }, dueDate: '', desc: '', url: 'https://trello.com/c/6' },
      { id: 'c7', name: 'Idée sans note', listId: 'l0', listName: 'Idées', category: 'backlog', color: '#8270db', pos: 7, progress: 0, priorityEnabled: false, inputs: {}, dueDate: '', desc: '', url: '' },
    ];
    var lists = [{ id: 'l0', name: 'Idées', category: 'backlog', color: '#8270db', icon: 'hourglass' }, { id: 'l1', name: 'À faire', category: 'unstarted', color: '#626f86', icon: 'circle' }, { id: 'l2', name: 'En cours', category: 'started', color: '#1d7afc', icon: 'player-play-filled' }, { id: 'l3', name: 'Terminé', category: 'completed', color: '#22a06b', icon: 'circle-check' }];
    TableTrello.load = function () {
      return new Promise(function (r) {
        setTimeout(function () {
          r({ lists: lists, rows: recs.map(function (x) { return TableModel.rowFromRecord(x, 'Projet'); }), categoryFieldId: null, categoryAvailable: false });
        }, window.__delay == null ? 1500 : window.__delay);
      });
    };
    TableTrello.moveCard = TableTrello.reorderCard = function () { return Promise.resolve(); };
    TableTrello.getTableSettings = function () { return Promise.resolve({ columns: TableModel.DEFAULT_COLUMNS.slice() }); };
    SheetsTrello.getSettings = function () { return Promise.resolve({}); };
    PriorityTrello.isRestAuthorized = function () { return Promise.resolve(true); };
    var goals = {
      nodes: [
        { id: 'g:launch', level: 'project', name: 'Lancement', listId: 'l1', icon: { i: 'rocket', c: '#5e6ad2' } },
        { id: 'g:board', level: 'project', name: 'Tableau de bord' },
      ],
      links: [
        { from: 'c1', to: 'g:launch' },
        { from: 'c5', to: 'g:launch' },
        { from: 'c7', to: 'g:launch' },
        { from: 'c2', to: 'g:board' },
        { from: 'c3', to: 'g:board' },
      ],
    };
    window.MindmapGoalsTrello = {
      load: function () { return Promise.resolve(goals); },
      save: function (_t, data) {
        goals = MindmapModel.normalizeGoals(data);
        return Promise.resolve(goals);
      },
    };
    // Writes of the Linear-style composer / keys (mock: edit the in-memory records).
    window.__writes = [];
    TableTrello.moveCard = function (t_, id, listId) { var r = recs.filter(function (x) { return x.id === id; })[0]; var l = lists.filter(function (x) { return x.id === listId; })[0]; if (r && l) { r.listId = l.id; r.listName = l.name; r.category = l.category; r.color = l.color; } window.__writes.push(['move', id, listId]); return Promise.resolve(); };
    TableTrello.createRow = function (t_, name, listId) { var l = lists.filter(function (x) { return x.id === listId; })[0]; var id = 'n' + (recs.length + 1); recs.push({ id: id, name: name, listId: listId, listName: l.name, category: l.category, color: l.color, pos: 99, progress: 0, priorityScore: 1, priorityLabel: 'Basse', inputs: { empressement: 'aucun', impact: 2 }, dueDate: '', desc: '', url: '' }); window.__writes.push(['create', name, listId]); return Promise.resolve({ cardId: id }); };
    PriorityTrello.restPutCard = function (t_, id, body) { window.__writes.push(['put', id, body]); return Promise.resolve({ ok: true }); };
    PriorityTrello.saveCardInputsById = function (t_, id, patch) { var r = recs.filter(function (x) { return x.id === id; })[0]; if (r) Object.assign(r.inputs, patch); window.__writes.push(['inputs', id, patch]); return Promise.resolve(); };
    GanttTrello.saveCardDates = function (t_, id, parts) { window.__writes.push(['dates', id, parts]); return Promise.resolve(); };
    var store = {};
    var t = {
      get: function (a, b, k) { return Promise.resolve(store[k] || null); },
      set: function (a, b, k, v) { store[k] = v; return Promise.resolve(); },
      board: function () { return Promise.resolve({ id: 'b1' }); },
      render: function (fn) { fn(); },
      sizeTo: function () {},
    };
    ViewTabs.mount(document.getElementById('viewTabs'), { active: 'kanban' });
    KanbanUI.mount(document.getElementById('kanbanMount'), t);
