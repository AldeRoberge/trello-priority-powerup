  <script>
    // ---- an in-memory Trello behind the real DocsTrello / DocsUI (no network) ----
    // ?dark switches the theme, ?unauth starts without a Trello token, ?empty starts with no document.
    var q = location.search;
    if (/[?&]dark\b/.test(q)) document.documentElement.setAttribute('data-color-mode', 'dark');
    var seedDocs = /[?&]empty\b/.test(q) ? [] : [
      { id: 'doc1', name: '📄 Compte rendu de lancement', closed: true, dateLastActivity: '2026-10-02T15:00:00Z',
        desc: DocsModel.packDesc('# Compte rendu\n\nPrésents : [@Marie Tremblay](person:m1) et [@Éric Gagnon](person:m2).\n\n## Décisions\n\n- Valider la [@Refonte du tableau de bord](task:c2) cette semaine\n- [x] Réserver la salle\n- [ ] Envoyer l’invitation\n\n> Prochaine étape : voir le [@Plan de projet](doc:doc2).\n\nVoir aussi **le gras**, *l’italique*, ++le souligné++ et `du code`.', { rev: 3 }) },
      { id: 'doc2', name: '📄 Plan de projet', closed: true, dateLastActivity: '2026-10-01T09:00:00Z',
        desc: DocsModel.packDesc('# Plan de projet\n\n1. Cadrage\n2. Maquettes\n3. Livraison', { rev: 1 }) },
    ];
    var fieldMode = /[?&]fields\b/.test(q);
    var boardLabels = fieldMode ? [
      { id: 'p1', name: 'Priority-Low', color: 'green' },
      { id: 'p2', name: 'Priority-VeryLow', color: 'blue' },
      { id: 'p3', name: 'Priority-High', color: 'red' },
      { id: 'l1', name: 'Location-Home', color: 'yellow' },
      { id: 'l2', name: 'Location-Work', color: 'orange' },
      { id: 'cat1', name: 'Category-Maintenance', color: 'purple' },
      { id: 'm1', name: 'Money-Expense', color: 'pink' },
    ] : [];
    window.fake = FakeTrello.create({
      authorized: !/[?&]unauth\b/.test(q),
      labels: boardLabels,
      lists: [{ id: 'l1', name: 'À faire' }, { id: 'l2', name: 'En cours' }],
      cards: [
        { id: 'c1', name: 'Préparer la réunion de lancement', idList: 'l1' },
        { id: 'c2', name: 'Refonte du tableau de bord', idList: 'l2', labels: fieldMode ? [
          { id: 'p1', name: 'Priority-Low', color: 'green' },
          { id: 'l1', name: 'Location-Home', color: 'yellow' },
          { id: 'm1', name: 'Money-Expense', color: 'pink' },
        ] : [] },
        { id: 'c3', name: 'Publier la version 2', idList: 'l2', dueComplete: true },
        { id: 'c4', name: 'Archiver les anciennes cartes', idList: 'l1' },
      ].concat(seedDocs),
      members: [
        { id: 'm1', fullName: 'Marie Tremblay', username: 'marie_t', initials: 'MT' },
        { id: 'm2', fullName: 'Éric Gagnon', username: 'eric', initials: 'ÉG' },
        { id: 'm3', fullName: 'Julie Roy', username: 'julie', initials: 'JR' },
      ],
    });
    SheetsTrello.trelloRest = fake.trelloRest;
    // The board snapshot behind the task panel (CardQuick): the fake cards plus the Table-style extras below.
    var extras = {
      c1: { progress: 0, dueDate: '2026-09-01', priorityScore: 7.4, priorityLabel: 'Haute', inputs: { empressement: 'vite', impact: 8 }, desc: 'Inviter **tout le monde**\n- ordre du jour\n- salle' },
      c2: { progress: 45, dueDate: '2026-11-20', priorityScore: 5.1, priorityLabel: 'Moyenne', inputs: { empressement: 'assez-vite', impact: 6 }, estimatedMinutes: 90, desc: 'Nouvelle maquette' },
      c3: { progress: 100 },
      c4: { progress: 10, blocked: true },
    };
    var boardLists = [{ id: 'l1', name: 'À faire', category: 'unstarted', color: '#626f86', icon: 'circle' }, { id: 'l2', name: 'En cours', category: 'started', color: '#1d7afc', icon: 'player-play-filled' }, { id: 'l3', name: 'Terminé', category: 'completed', color: '#22a06b', icon: 'circle-check' }];
    TableTrello.load = function () {
      var rows = fake.cards.filter(function (c) { return !c.closed && !/^📄/.test(c.name); }).map(function (c, i) {
        var l = boardLists.filter(function (x) { return x.id === c.idList; })[0] || boardLists[0];
        return TableModel.rowFromRecord(Object.assign({ id: c.id, name: c.name, listId: l.id, listName: l.name, category: l.category, color: l.color, pos: i + 1, url: 'https://trello.com/c/' + c.id }, extras[c.id] || {}, c.desc ? { desc: c.desc } : {}), '');
      });
      return Promise.resolve({ lists: boardLists, rows: rows, categoryFieldId: null, categoryAvailable: false });
    };
    function fakeCard(id) { return fake.cards.filter(function (c) { return c.id === id; })[0]; }
    TableTrello.moveCard = function (t, id, listId) { fakeCard(id).idList = listId; return Promise.resolve(); };
    TableTrello.archiveCard = function (t, id) { fakeCard(id).closed = true; return Promise.resolve(); };
    TableTrello.unarchiveCard = function (t, id) { fakeCard(id).closed = false; return Promise.resolve(); };
    TableTrello.saveName = function (t, id, name) { fakeCard(id).name = name; return Promise.resolve(); };
    TableTrello.saveDesc = function (t, row, text) { fakeCard(row.id).desc = text; return Promise.resolve(text); };
    CompletionTrello.getCardCompletionById = function (t, id) { return Promise.resolve({ items: [], progress: (extras[id] || {}).progress || 0 }); };
    CompletionTrello.saveCardCompletionById = function (t, id, data) { (extras[id] = extras[id] || {}).progress = data.progress; return Promise.resolve(); };
    GanttTrello.setCardBlocked = function (t, id, on) { (extras[id] = extras[id] || {}).blocked = !!on; return Promise.resolve({ ok: true }); };
    PriorityTrello.isRestAuthorized = function () { return Promise.resolve(!/[?&]unauth\b/.test(q)); };
    GanttTrello.ensureRestAuthorized = function () { fake.setAuthorized(true); PriorityTrello.isRestAuthorized = function () { return Promise.resolve(true); }; return Promise.resolve({ ok: true }); };
    PriorityTrello.getBoardMembers = function () { return fake.t.board('members').then(function (b) { return b.members; }); };
    PriorityTrello.pageUrl = function (p) { return p; };
    People.load = function () { return Promise.resolve({ people: [{ id: 'person-1', name: 'Sophie Lavoie', relation: 'cliente', aliases: [], roles: [], email: 'sophie@example.com', phone: '514-555-0100' }] }); };
    ViewTabs.mount(document.getElementById('viewTabs'), { active: 'docs' });
    window.ui = DocsUI.mount(document.getElementById('docsMount'), fake.t);

    // ?run executes sandbox/e2e/docs-tests.js (report in #e2e-report); ?manual just mounts for poking by hand
    if (/[?&](run|manual)\b/.test(q)) {
      var pre = document.createElement('pre');
      pre.id = 'e2e-report';
      pre.style.cssText = 'position:fixed;right:0;bottom:0;max-width:45vw;max-height:45vh;overflow:auto;margin:0;padding:8px;background:#111;color:#7CFC00;font:11px/1.4 monospace;z-index:99999;white-space:pre-wrap';
      document.body.appendChild(pre);
      var s = document.createElement('script');
      s.src = '/sandbox/e2e/docs-tests.js';
      document.body.appendChild(s);
    }
  </script>
