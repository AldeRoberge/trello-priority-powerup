  <script>
    var seed = {
      items: [
        { id: 'a', text: 'Prendre les mesures du bureau', progress: 100, estimatedMinutes: 30, estimatedMinutesLocked: true },
        { id: 'b', text: 'Choisir les dimensions et le style', progress: 40, estimatedMinutes: 60, estimatedMinutesLocked: true,
          items: [
            { id: 'b1', text: 'Capacité de charge', progress: 100 },
            { id: 'b2', text: 'Style et couleur', progress: 0 }
          ] },
        { id: 'c', text: 'Comparer les modèles en magasin', progress: 0, estimatedMinutes: 90, estimatedMinutesLocked: true, blocked: true,
          blockedReasons: [{ text: 'Attente du budget' }] },
        { id: 'd', text: 'Commander et planifier la livraison', progress: 0 }
      ]
    };
    var CT = window.CompletionTrello;
    var last = null;
    function paintSummary() {
      var model = CompletionTree.buildTreeModel(last || CT.normalizeCompletionData(seed), { cardName: 'Achat bibliothèque' });
      var node = CompletionTree.renderSummaryTree(model, { onOpen: function () { console.log('open'); } });
      var host = document.getElementById('summaryMount');
      host.replaceChildren(); if (node) host.appendChild(node);
    }
    var ui = CompletionUI.mountCompletionUI(document.getElementById('completionMount'), {
      data: seed, showCardHeader: false, cardName: 'Achat d’une bibliothèque pour mon bureau',
      onChange: function (d) { last = d; paintSummary(); document.getElementById('out').textContent = JSON.stringify(d, null, 1).slice(0, 600); }
    });
    paintSummary();
  </script>
