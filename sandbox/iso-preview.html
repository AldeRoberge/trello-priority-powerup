<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../components/shared/view-tabs.css" />
  <script src="../components/shared/isolation.js"></script>
  <script src="../components/shared/view-tabs.js"></script>
</head>
<body>
  <div id="tabs"></div>
  <table id="grid"></table>
  <script>
    ViewTabs.mount(document.getElementById('tabs'), { active: 'table' });
    var rows = [
      { id: 'parent', name: 'Page d’accueil', project: 'Site', projectId: 'g:site', assignees: [{ id: 'ada', name: 'Ada' }], items: [
        { id: 'a', text: 'Rédiger' },
        { id: 'b', text: 'Relire' },
      ] },
      { id: 'other', name: 'Facture', project: 'Autre', projectId: 'g:autre', assignees: [{ id: 'bob', name: 'Bob' }], items: [] },
    ];
    Isolation.setWorld(rows);
    Isolation.set({ kind: 'project', id: 'g:site', label: 'Site' });
    var grid = document.getElementById('grid');
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.setAttribute('data-iso-card', r.id);
      var td = document.createElement('td');
      td.textContent = r.name;
      tr.appendChild(td);
      grid.appendChild(tr);
    });
    Isolation.paint(document.body);
  </script>
</body>
</html>
