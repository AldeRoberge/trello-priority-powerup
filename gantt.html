  <script>
    (function () {
      try {
        var m = localStorage.getItem('trello-priority-powerup/color-mode');
        if (m !== 'dark' && m !== 'light') return;
        var root = document.documentElement;
        root.setAttribute('data-color-mode', m);
        root.style.colorScheme = m;
        if (m === 'dark') root.style.backgroundColor = '#1d2125';
        var meta = document.createElement('meta');
        meta.name = 'color-scheme';
        meta.content = m;
        document.head.appendChild(meta);
      } catch (e) {}
    })();
  </script>
  <style>
    html[data-color-mode="dark"] { background: #1d2125; color-scheme: dark; }
    html[data-color-mode="light"] { color-scheme: light; }

<body class="tp-page tp-page--gantt">
  <div id="viewTabs"></div>
  <div id="ganttMount">
    <script>document.currentScript.parentNode.innerHTML = Skeleton.html('gantt');</script>
  </div>
  <script>
    ViewTabs.mount(document.getElementById('viewTabs'), { active: 'gantt' });
    PriorityTrello.initIframePage(function (t) {
      if (window.TpDebug && typeof TpDebug.configureFromProfile === 'function') {
        TpDebug.configureFromProfile(t).then(function (on) {
          if (on) TpDebug.log('gantt', 'page.init');
        });
      }
      var mount = document.getElementById('ganttMount');
      GanttUI.mountGantt(mount, t);
      ViewTabs.highlightFromUrl(function (id) { return '.gantt-row[data-card-id="' + id + '"]'; });
    });
  </script>
